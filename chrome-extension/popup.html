<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Moonfeed</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 260px;
      background: #0a0a0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 20px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .logo {
      width: 36px;
      height: 36px;
      border-radius: 9px;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, #a855f7, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tagline {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 18px;
      padding-left: 46px;
    }
    .btn-primary {
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, #a855f7, #06b6d4);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.88; }
  </style>
</head>
<body>
  <div class="header">
    <img class="logo" src="icons/icon48.png" alt="Moonfeed" />
    <span class="title">Moonfeed</span>
  </div>
  <p class="tagline">Trending Solana meme coins, live.</p>
  <button class="btn-primary" id="open-panel">Open Side Panel</button>
  <script src="popup.js"></script>
</body>
</html>
